<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Review the fragrances in your Violet bag before continuing to the simulated prototype checkout.">
  <title>Fragrance Bag · Violet Parfumerie</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="perfume-luxury.css">
  <link rel="stylesheet" href="desktop-luxury-v2.css" media="(min-width:1024px)">
  <link rel="stylesheet" href="desktop-experience-v4.css">
  <link rel="stylesheet" href="desktop-experience-v4-rollout.css">
</head>
<body>
  <div data-site-header></div>
  <main class="container">
    <section class="page-hero v4-utility-hero">
      <div class="breadcrumbs"><a href="index.html">Violet</a> / Fragrance Bag</div>
      <span class="section-kicker">BAG / 01</span>
      <h1>Fragrance Bag</h1>
      <p>Your selected objects, grouped clearly so the final decision stays simple.</p>
    </section>
    <section class="cart-layout">
      <div data-cart></div>
      <aside class="summary-card v4-summary-card">
        <span class="v4-kicker">ORDER SUMMARY</span>
        <h3>Your selection</h3>
        <div class="summary-row"><span>Subtotal</span><b data-subtotal></b></div>
        <div class="summary-row"><span>Delivery</span><b data-shipping></b></div>
        <div class="summary-row"><span>Violet privilege</span><b data-saving></b></div>
        <div class="summary-total"><span>Total</span><span data-total></span></div>
        <a class="btn btn-primary" href="checkout.html">Continue to checkout</a>
        <a class="v4-text-link" href="search.html">Continue exploring →</a>
      </aside>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="storefront-v4.js"></script>
  <script src="storefront-v4-rollout.js"></script>
  <script src="figma-capture.js"></script>
</body>
</html>
