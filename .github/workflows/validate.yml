name: Validate static site

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check scent-portrait.js
          node --check storefront-v3.js
          node --check storefront-v4.js
          node --check storefront-v4-rollout.js
          node --check personalization-core.js
          node --check discovery-loop.js
          node --check product-v7.js
          node --check personalization-loop.js
          node --check scripts/mobile_discovery_qa.mjs
          node --check scripts/desktop_visual_qa.mjs
          node --check scripts/scent_portrait_qa.mjs
          node --check scripts/storefront_v3_qa.mjs
          node --check scripts/v4_representative_qa.mjs

      - name: Validate required static files
        run: |
          for f in index.html search.html product.html discovery.html houses.html house.html finder.html cart.html checkout.html order-success.html seller.html admin.html styles.css perfume-luxury.css desktop-experience-v4.css maison-redesign.css mobile-discovery.css ops-system.css personalization-core.js discovery-loop.js product-v7.js personalization-loop.js .uiux-profile.json scripts/mobile_discovery_qa.mjs design-artifacts/factory-v7-mobile/context.json design-artifacts/factory-v7-mobile/research.md design-artifacts/factory-v7-mobile/ux-ia.md design-artifacts/factory-v7-mobile/art-direction.md design-artifacts/factory-v7-mobile/design-contract.md design-artifacts/factory-v7-mobile/design-system.md design-artifacts/factory-v7-mobile/visual-composition.md design-artifacts/factory-v7-mobile/implementation-plan.md design-artifacts/factory-v7-mobile/skill-trace.json; do test -f "$f"; done
          test ! -e package.json
          test ! -e tsconfig.json

      - name: Validate Violet mobile discovery direction
        run: |
          grep -q "Three ways into Violet" index.html
          grep -q "Rule-based · not AI" index.html
          grep -q "data-v4-house-index" index.html
          grep -q "v4-shelf-grid" index.html
          grep -q "personalization-core.js" finder.html
          grep -q "09 questions" finder.html
          grep -q "discovery-loop.js" discovery.html
          grep -q "data-v7-feedback" discovery.html
          grep -q "personalization-loop.js" product.html
          grep -q "Trial sample" personalization-loop.js
          grep -q "Full bottle" personalization-loop.js
          grep -q "mobile-discovery.css" index.html
          grep -q "mobile-discovery.css" finder.html
          grep -q "mobile-discovery.css" search.html
          grep -q "mobile-discovery.css" product.html
          grep -q "mobile-discovery.css" discovery.html
          grep -q "mobile-discovery.css" cart.html
          grep -q "mobile-discovery.css" checkout.html
          grep -q "ops-system.css" seller.html
          grep -q "ops-system.css" admin.html
          grep -q "STATIC / SIMULATED" seller.html
          grep -q "STATIC / SIMULATED" admin.html
          ! grep -Rqi "AI-powered\|powered by AI\|machine learning personalization" -- *.html *.js

      - name: Validate Factory external-brain contract
        run: |
          node -e "const c=require('./design-artifacts/factory-v7-mobile/context.json'); if(c.brain!=='external'||c.target.repository!=='Ngh1aa/VioletMarketplace'||c.target.branch!=='factory/violet-mobile-discovery') process.exit(1)"
          node -e "const t=require('./design-artifacts/factory-v7-mobile/skill-trace.json'); if(t.mode!=='external-brain'||!t.active_specialists.some(x=>x.skill==='interaction-patterns-and-form-ux')) process.exit(1)"
          grep -q '221370ef294408f3f5a0c6a7fb0567c3db840c3e' design-artifacts/factory-v7-mobile/skill-trace.json
          grep -q 'e8ed8c9212d20edb2cf4c8c0881fff34add7076e' design-artifacts/factory-v7-mobile/skill-trace.json

      - name: Preserve previous grounded contracts
        run: |
          grep -q 'visual-design-direction' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'interaction-patterns-and-form-ux' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'visual_composition' design-artifacts/scent-portrait-contract.json
          grep -q 'rendered_evidence_required' design-artifacts/desktop-v3-design-contract.json
          grep -q 'do not process a real transaction' checkout.html
          grep -q '1a3c9ef2d72e6bd0d4a4fc79c885c59f98e41c33' docs/uiux/Skill-Version-Lock.md

      - name: Validate UIUX operating profile
        run: |
          node -e "const p=require('./.uiux-profile.json'); if(p.project.mode!=='interactive_prototype') process.exit(1); if(p.constraints.responsive_scope!=='responsive_all') process.exit(1); if(p.constraints.primary_viewport!=='390x844') process.exit(1); if(p.constraints.skill_routing!=='smallest_applicable_graph') process.exit(1); if(p.constraints.release_authorization!=='merge_and_deploy') process.exit(1);"
          grep -q 'Rule-based recommendations' .uiux-profile.json
          grep -q 'Creative Director' .uiux-profile.json
