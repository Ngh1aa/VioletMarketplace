name: Validate static site

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check scent-portrait.js
          node --check scripts/desktop_visual_qa.mjs
          node --check scripts/scent_portrait_qa.mjs

      - name: Validate required static files
        run: |
          test -f index.html
          test -f search.html
          test -f product.html
          test -f cart.html
          test -f checkout.html
          test -f order-success.html
          test -f seller.html
          test -f admin.html
          test -f finder.html
          test -f styles.css
          test -f perfume-luxury.css
          test -f desktop-luxury-v2.css
          test -f scent-portrait.css
          test -f scent-portrait.js
          test -f DESIGN-DIRECTION.md
          test -f design-artifacts/scent-portrait-contract.json
          test -f design-artifacts/scent-portrait-skill-trace.json
          test -f scripts/desktop_visual_qa.mjs
          test -f scripts/scent_portrait_qa.mjs
          test -f data.js
          test -f app.js
          test ! -e package.json
          test ! -e tsconfig.json

      - name: Validate Violet Parfumerie direction
        run: |
          grep -q "Violet Parfumerie" index.html
          grep -q "Curated fragrance marketplace" index.html
          grep -q "Violet philosophy" index.html
          grep -q "finder.html" index.html
          grep -q "Olfactive family" search.html
          grep -q "note-pyramid" app.js
          grep -q "category: 'floral'" data.js
          grep -q "category: 'woody'" data.js
          grep -q "category: 'amber'" data.js
          grep -q "desktop-luxury-v2.css" index.html
          grep -q "desktop-luxury-v2.css" search.html
          grep -q "desktop-luxury-v2.css" product.html
          grep -q "desktop-luxury-v2.css" cart.html
          grep -q "desktop-luxury-v2.css" checkout.html

      - name: Validate skill-grounded Scent Portrait contract
        run: |
          grep -q 'visual-design-direction' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'brand-distinctiveness-and-visual-signature' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'visual-taste-calibration' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'interaction-patterns-and-form-ux' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'ui-craft-and-visual-qa' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'visual_composition' design-artifacts/scent-portrait-contract.json
          grep -q 'browser_qa' design-artifacts/scent-portrait-contract.json
          grep -q 'visual_qa' design-artifacts/scent-portrait-contract.json
