name: Validate static site

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check scent-portrait.js
          node --check storefront-v3.js
          node --check storefront-v4.js
          node --check storefront-v4-rollout.js
          node --check scripts/desktop_visual_qa.mjs
          node --check scripts/scent_portrait_qa.mjs
          node --check scripts/storefront_v3_qa.mjs
          node --check scripts/v4_representative_qa.mjs

      - name: Validate required static files
        run: |
          test -f index.html
          test -f search.html
          test -f product.html
          test -f discovery.html
          test -f houses.html
          test -f house.html
          test -f finder.html
          test -f cart.html
          test -f checkout.html
          test -f order-success.html
          test -f seller.html
          test -f admin.html
          test -f styles.css
          test -f perfume-luxury.css
          test -f desktop-luxury-v2.css
          test -f desktop-experience-v3.css
          test -f desktop-experience-v4.css
          test -f desktop-experience-v4-rollout.css
          test -f maison-redesign.css
          test -f scent-portrait.css
          test -f scent-portrait.js
          test -f storefront-v3.js
          test -f storefront-v4.js
          test -f storefront-v4-rollout.js
          test -f DESIGN-DIRECTION.md
          test -f .uiux-profile.json
          test -f docs/uiux/Operating-Profile.md
          test -f docs/uiux/Skill-Version-Lock.md
          test -f docs/uiux/Project-Config.md
          test -f docs/uiux/Project-Truth.md
          test -f docs/uiux/Old-Baseline.md
          test -f docs/uiux/Current-Site-Audit.md
          test -f docs/uiux/Reference-Benchmark.md
          test -f docs/uiux/Design-Contract.md
          test -f docs/uiux/Redesign-Delta-Contract.md
          test -f docs/uiux/Page-Role-Matrix.md
          test -f docs/uiux/Media-Contract.md
          test -f docs/uiux/System-Reality-and-Data-Contracts.md
          test -f docs/uiux/Verification-Matrix.md
          test -f docs/uiux/Requirement-Coverage-Ledger.md
          test -f docs/uiux/Skill-Execution-Ledger.md
          test -f docs/uiux/Phase-1-Handoff.md
          test -f docs/uiux/Phase-State.md
          test -f design-artifacts/scent-portrait-contract.json
          test -f design-artifacts/scent-portrait-skill-trace.json
          test -f design-artifacts/desktop-v3-design-contract.json
          test -f scripts/v4_representative_qa.mjs
          test ! -e package.json
          test ! -e tsconfig.json

      - name: Validate Violet V4 direction and rollout
        run: |
          grep -q "Violet Parfumerie" index.html
          grep -q "Three ways into Violet" index.html
          grep -q "data-v4-house-index" index.html
          grep -q "v4-shelf-grid" index.html
          grep -q "v4-house-index" index.html
          grep -q "discovery.html" index.html
          grep -q "data-v4-houses-index" houses.html
          grep -q "data-v4-house-detail" house.html
          for f in index.html search.html product.html discovery.html houses.html house.html finder.html cart.html checkout.html order-success.html; do grep -q "desktop-experience-v4.css" "$f"; done
          grep -q 'href="maison-redesign.css"' search.html
          ! grep -q 'href="desktop-experience-v4-rollout.css"' search.html
          ! grep -q '<script src="app.js"' search.html
          grep -q "desktop-experience-v4-rollout.css" houses.html
          grep -q "desktop-experience-v4-rollout.css" house.html
          grep -q "desktop-experience-v4-rollout.css" finder.html
          grep -q "desktop-experience-v4-rollout.css" cart.html
          grep -q "desktop-experience-v4-rollout.css" checkout.html
          ! grep -q '<script src="storefront-v4.js"' index.html
          ! grep -q '<script src="storefront-v4-rollout.js"' index.html
          grep -q "storefront-v4.js" search.html
          grep -q "load('storefront-v4.js')" product.html
          grep -q "storefront-v4.js" discovery.html
          grep -q "storefront-v4-rollout.js" houses.html
          grep -q "storefront-v4-rollout.js" house.html
          grep -q "storefront-v4-rollout.js" finder.html
          grep -q "v4-buying-desk" storefront-v4.js
          grep -q "violet-discovery-trio-v1" storefront-v4.js
          grep -q "renderHouseDetail" storefront-v4-rollout.js
          grep -q "category: 'floral'" data.js
          grep -q "category: 'woody'" data.js
          grep -q "category: 'amber'" data.js
          ! grep -q "desktop-experience-v3.css" index.html
          ! grep -q "desktop-experience-v3.css" search.html
          ! grep -q "desktop-experience-v3.css" product.html
          ! grep -q "Violet philosophy" index.html

      - name: Validate Prompt OS Phase 1 contract
        run: |
          grep -q 'PHASE 1 RESULT = PASSED' docs/uiux/Phase-1-Handoff.md
          grep -q 'result: `PASSED`' docs/uiux/Phase-State.md
          grep -q 'BLOCKED: 0' docs/uiux/Phase-State.md
          grep -q 'UNACCOUNTED: 0' docs/uiux/Phase-State.md
          grep -q 'Home + PLP + PDP + Discovery' docs/uiux/Phase-State.md
          grep -q 'visibly and behaviorally structural' docs/uiux/Redesign-Delta-Contract.md
          grep -q 'N/A_JUSTIFIED' docs/uiux/Design-Intelligence-Decision-Log.md
          grep -q '1a3c9ef2d72e6bd0d4a4fc79c885c59f98e41c33' docs/uiux/Skill-Version-Lock.md

      - name: Preserve previous grounded contracts
        run: |
          grep -q 'visual-design-direction' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'interaction-patterns-and-form-ux' design-artifacts/scent-portrait-skill-trace.json
          grep -q 'visual_composition' design-artifacts/scent-portrait-contract.json
          grep -q 'browser_qa' design-artifacts/scent-portrait-contract.json
          grep -q 'rendered_evidence_required' design-artifacts/desktop-v3-design-contract.json
          grep -q 'do not process a real transaction' checkout.html

      - name: Validate UIUX operating profile
        run: |
          node -e "const p=require('./.uiux-profile.json'); if(p.project.mode!=='interactive_prototype') process.exit(1); if(p.constraints.responsive_scope!=='desktop_only') process.exit(1); if(p.constraints.skill_routing!=='smallest_applicable_graph') process.exit(1);"
          grep -q '1a3c9ef2d72e6bd0d4a4fc79c885c59f98e41c33' docs/uiux/Skill-Version-Lock.md
          grep -q 'rendered evidence + automated sanity gates + Creative Director screenshot inspection' .uiux-profile.json
          grep -q 'Factory and routed skills own repeatable process and verification' .uiux-profile.json
          grep -q 'Installed does not mean active' docs/uiux/Skill-Version-Lock.md