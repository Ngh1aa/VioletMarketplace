name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare cache-busted static site
        env:
          CACHE_VERSION: ${{ github.sha }}
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          site = Path('_site')
          version = os.environ['CACHE_VERSION'][:12]

          # Version every local CSS/JS reference instead of maintaining a fragile
          # hand-written asset allowlist. This keeps newly added redesign files from
          # being served stale by GitHub Pages or the browser cache.
          html_asset = re.compile(
              r'(\b(?:href|src)=["\'])(?!https?:|//|data:)([^"\']+\.(?:css|js))(?:\?[^"\']*)?(["\'])',
              re.IGNORECASE,
          )

          for html in site.rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              text = html_asset.sub(
                  lambda match: f'{match.group(1)}{match.group(2)}?v={version}{match.group(3)}',
                  text,
              )
              html.write_text(text, encoding='utf-8')

          # CSS imported from another CSS file also needs a version. Without this,
          # desktop-experience-v4.css can be fresh while image-first-redesign.css
          # remains stale in the browser cache.
          css_import = re.compile(
              r'(@import\s+url\(\s*["\']?)([^"\')?]+\.css)(?:\?[^"\')]+)?(["\']?\s*\))',
              re.IGNORECASE,
          )

          for css in site.rglob('*.css'):
              text = css.read_text(encoding='utf-8')
              text = css_import.sub(
                  lambda match: f'{match.group(1)}{match.group(2)}?v={version}{match.group(3)}',
                  text,
              )
              css.write_text(text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
