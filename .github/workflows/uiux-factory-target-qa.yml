name: UIUX Factory Target QA

on:
  push:
    branches:
      - factory/violet-figma-safe-redesign
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "assets/**"
      - "design-artifacts/factory-v6/**"
      - "docs/uiux/Figma-Capture.md"
      - ".github/workflows/uiux-factory-target-qa.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Violet target
        uses: actions/checkout@v4

      - name: Checkout pinned UIUX Factory
        uses: actions/checkout@v4
        with:
          repository: Ngh1aa/uiux-ai-workspace
          ref: 7f4f4a61680f377d3d244c4f38a25b2eb79d7f9f
          path: .uiux-factory

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Factory QA dependencies
        working-directory: .uiux-factory/uiux-factory/qa
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: .uiux-factory/uiux-factory/qa
        run: npx playwright install --with-deps chromium

      - name: Verify same-origin buyer media contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "images.pexels.com" . --include='*.html' --include='*.js' --include='*.css' --exclude-dir=.git --exclude-dir=.uiux-factory; then
            echo "Remote Pexels media remains in buyer-facing source." >&2
            exit 1
          fi
          while IFS= read -r path; do
            test -s "$path" || { echo "Missing declared media: $path" >&2; exit 1; }
          done < <(jq -r '.[].path' assets/media-manifest.json)

      - name: Serve Violet and run Factory browser / axe / Lighthouse QA
        working-directory: .uiux-factory/uiux-factory/qa
        env:
          QA_TARGET_DIR: ${{ github.workspace }}
          QA_BASE_URL: http://127.0.0.1:4173
          QA_ROUTES: /index.html,/search.html,/product.html?id=violette-03,/discovery.html,/index.html?figma=1
          QA_PRODUCTION_ROUTES: /index.html,/search.html,/product.html?id=violette-03,/discovery.html
        run: |
          set -euo pipefail
          node scripts/serve-target.mjs > /tmp/violet-factory-target.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/wait-ready.mjs

          # Browser evidence, axe and media checks intentionally include ?figma=1.
          # Figma capture mode forces eager media and disables non-essential motion,
          # so it is verified for correctness/readiness but is not a production
          # performance surface.
          npm test

          QA_ROUTES="$QA_PRODUCTION_ROUTES" node scripts/write-lighthouse-config.mjs
          npx lhci autorun --config=lighthouserc.runtime.json

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/violet-factory-target.log || true

      - name: Upload Factory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-uiux-factory-evidence
          path: .uiux-factory/uiux-factory/qa/artifacts/
          if-no-files-found: warn
          retention-days: 14
