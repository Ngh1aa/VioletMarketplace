name: Storefront V3 QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  storefront-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        if: ${{ !hashFiles('desktop-experience-v4.css') }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop V3 flow and visual gates
        run: |
          if [ -f desktop-experience-v4.css ] && grep -q "desktop-experience-v4.css" index.html; then
            mkdir -p artifacts/storefront-v3-qa
            printf '{"status":"N/A_JUSTIFIED","reason":"V3 structural gate is superseded by the active V4 representative/full-site QA."}\n' > artifacts/storefront-v3-qa/storefront-v3-report.json
            echo "N/A_JUSTIFIED: V4 owns current storefront structural verification."
          else
            node scripts/storefront_v3_qa.mjs artifacts/storefront-v3-qa
          fi

      - name: Upload V3 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-storefront-v3-qa
          path: artifacts/storefront-v3-qa/
          if-no-files-found: error
          retention-days: 14
