name: Visual Layout Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'scripts/visual_layout_guard.mjs'
      - '.github/workflows/visual-layout-guard.yml'
  workflow_dispatch:

jobs:
  visual-layout-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run rendered layout regression guard
        run: node scripts/visual_layout_guard.mjs artifacts/visual-layout-guard
      - name: Upload visual guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-visual-layout-guard
          path: artifacts/visual-layout-guard
          retention-days: 14
