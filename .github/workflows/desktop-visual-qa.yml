name: Desktop Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render desktop and run visual gates
        run: node scripts/desktop_visual_qa.mjs artifacts/desktop-visual-qa

      - name: Upload desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-desktop-visual-qa
          path: artifacts/desktop-visual-qa/
          if-no-files-found: error
          retention-days: 14
