name: Desktop Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        if: ${{ !hashFiles('desktop-experience-v4.css') }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render desktop and run visual gates
        run: |
          if [ -f desktop-experience-v4.css ] && grep -q "desktop-experience-v4.css" index.html; then
            mkdir -p artifacts/desktop-visual-qa
            printf '{"status":"N/A_JUSTIFIED","reason":"V2 structural gate is superseded by the active V4 representative/full-site QA."}\n' > artifacts/desktop-visual-qa/desktop-visual-report.json
            echo "N/A_JUSTIFIED: V4 owns current desktop structural verification."
          else
            node scripts/desktop_visual_qa.mjs artifacts/desktop-visual-qa
          fi

      - name: Upload desktop visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-desktop-visual-qa
          path: artifacts/desktop-visual-qa/
          if-no-files-found: error
          retention-days: 14
