name: Language Consistency QA

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'docs/uiux/Content-Strategy.md'
      - 'scripts/language_consistency_qa.mjs'
      - '.github/workflows/language-consistency-qa.yml'
  workflow_dispatch:

jobs:
  language-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit rendered Vietnamese UI
        run: node scripts/language_consistency_qa.mjs artifacts/language-consistency
      - name: Upload language QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-language-consistency
          path: artifacts/language-consistency
          retention-days: 14
