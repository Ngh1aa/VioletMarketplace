<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fragrance Library — refine Violet scents by family, mood, house, presence and trial eligibility.">
  <title>Fragrance Library · Violet Parfumerie</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="perfume-luxury.css">
  <link rel="stylesheet" href="desktop-experience-v4.css">
</head>
<body>
  <div data-site-header></div>
  <main class="container v4-library-page">
    <header class="v4-library-masthead">
      <div><span class="v4-kicker">V.10 / FRAGRANCE LIBRARY</span><h1 data-result-title>Fragrance Library</h1></div>
      <div class="v4-library-intro"><p>Objects first. Refine only when it helps the decision.</p><span data-result-count></span></div>
    </header>
    <div class="active-chips v4-active-chips" data-active-chips></div>
    <section class="v4-plp">
      <aside class="v4-filter-rail" data-v4-filter aria-label="Fragrance refinement"></aside>
      <div class="v4-plp-results">
        <div class="v4-plp-toolbar"><span data-result-count></span><select class="sort" data-sort aria-label="Sort fragrances"><option value="popular">Violet order</option><option value="rating">Highest rated</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div>
        <div class="v4-object-grid" data-results></div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="storefront-v4.js"></script>
  <script src="storefront-v4-rollout.js"></script>
</body>
</html>
