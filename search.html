<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Thư viện mùi hương Violet — lọc theo nhóm mùi, cảm giác, nhà hương, độ hiện diện và khả năng thử trước.">
  <title>Thư viện mùi hương · Violet Parfumerie</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="perfume-luxury.css">
  <link rel="stylesheet" href="desktop-experience-v4.css">
  <link rel="stylesheet" href="desktop-experience-v4-rollout.css">
</head>
<body>
  <div data-site-header></div>
  <main class="container v4-library-page">
    <header class="v4-library-masthead">
      <div><span class="v4-kicker">V.10 / THƯ VIỆN MÙI HƯƠNG</span><h1 data-result-title>Thư viện mùi hương</h1></div>
      <div class="v4-library-intro"><p>Ưu tiên sản phẩm. Chỉ lọc khi điều đó giúp bạn quyết định.</p><span data-result-count></span></div>
    </header>
    <div class="active-chips v4-active-chips" data-active-chips></div>
    <section class="v4-plp">
      <aside class="v4-filter-rail" data-v4-filter aria-label="Bộ lọc mùi hương"></aside>
      <div class="v4-plp-results">
        <div class="v4-plp-toolbar"><span data-result-count></span><select class="sort" data-sort aria-label="Sắp xếp mùi hương"><option value="popular">Thứ tự Violet</option><option value="rating">Đánh giá cao</option><option value="price-asc">Giá thấp đến cao</option><option value="price-desc">Giá cao đến thấp</option></select></div>
        <div class="v4-object-grid" data-results></div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="storefront-v4.js"></script>
  <script src="storefront-v4-rollout.js"></script>
</body>
</html>
