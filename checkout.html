<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanh toán · Violet Marketplace</title><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main class="container"><section class="page-hero"><div class="breadcrumbs"><a href="cart.html">Giỏ hàng</a> / Thanh toán</div><h1>Thanh toán</h1><p>Một bước cuối, không banner và không nội dung gây xao nhãng.</p></section><form class="checkout-layout" data-checkout-form><div><section class="checkout-block"><h3>1. Địa chỉ nhận hàng</h3><div class="form-grid"><div class="field"><label>Họ và tên</label><input required placeholder="Nguyễn Văn A"></div><div class="field"><label>Số điện thoại</label><input required inputmode="tel" placeholder="09xx xxx xxx"></div><div class="field full"><label>Địa chỉ</label><input required placeholder="Số nhà, tên đường, phường/xã"></div><div class="field"><label>Tỉnh / Thành phố</label><select required><option>TP. Hồ Chí Minh</option><option>Hà Nội</option><option>Đà Nẵng</option></select></div><div class="field"><label>Quận / Huyện</label><input required placeholder="Quận / Huyện"></div></div></section><section class="checkout-block"><h3>2. Phương thức giao hàng</h3><label class="check"><input type="radio" checked name="shipping"> Giao tiêu chuẩn · dự kiến 2–4 ngày</label><br><label class="check"><input type="radio" name="shipping"> Giao nhanh · dự kiến ngày mai</label></section><section class="checkout-block"><h3>3. Thanh toán</h3><label class="check"><input type="radio" checked name="payment"> Thanh toán khi nhận hàng</label><br><label class="check"><input type="radio" name="payment"> Thẻ / ví điện tử (mô phỏng)</label></section></div><aside class="summary-card"><h3>Đơn hàng</h3><div data-checkout-items></div><div class="summary-row"><span>Tạm tính</span><b data-subtotal></b></div><div class="summary-row"><span>Vận chuyển</span><b data-shipping></b></div><div class="summary-row"><span>Voucher</span><b data-saving></b></div><div class="summary-total"><span>Tổng cộng</span><span data-total></span></div><button class="btn btn-primary" type="submit">Đặt hàng</button></aside></form></main><div data-site-footer></div><script src="data.js"></script><script src="app.js"></script></body></html>
